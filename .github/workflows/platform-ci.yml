name: platform-ci

on:
  push:
    paths:
      - "apps/platform/**"
      - ".github/workflows/platform-ci.yml"
  pull_request:
    paths:
      - "apps/platform/**"
      - ".github/workflows/platform-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    # Placeholder so prisma validate can resolve the datasource env; no DB is contacted.
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/horoprive?schema=public"
    defaults:
      run:
        working-directory: apps/platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/platform/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx tsc --noEmit

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-petrocore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petrocore}
      POSTGRES_DB: ${POSTGRES_DB:-petrocore}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-petrocore}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./apps/api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  ai-gateway:
    build: ./services/ai-gateway
    env_file: .env
    ports:
      - "9000:9000"
    volumes:
      - ./services/ai-gateway:/app

  worker:
    build: ./apps/api
    env_file: .env
    depends_on:
      - db
      - redis
    command: celery -A app.core.worker.celery_app worker --loglevel=info
    volumes:
      - ./apps/api:/app

  web:
    build: ./apps/web
    env_file: .env
    depends_on:
      - api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:

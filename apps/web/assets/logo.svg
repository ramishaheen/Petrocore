<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 410" role="img" aria-label="HORO PRIVÉ — Private Watch Advisor">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A24A"/>
      <stop offset="0.5" stop-color="#F0D79A"/>
      <stop offset="1" stop-color="#C9A24A"/>
    </linearGradient>
  </defs>
  <!-- emblem -->
  <g transform="translate(280,116)">
    <circle r="72" fill="none" stroke="url(#gold)" stroke-width="2.5"/>
    <circle r="58" fill="none" stroke="url(#gold)" stroke-width="6" stroke-dasharray="2.6 27.4" opacity="0.85"/>
    <text y="22" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="60" font-weight="700" letter-spacing="-6" fill="#eef2f8">HP</text>
  </g>
  <!-- wordmark -->
  <text x="280" y="272" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" letter-spacing="7" fill="#eef2f8">HORO PRIVÉ</text>
  <!-- rule + diamond -->
  <line x1="150" y1="306" x2="268" y2="306" stroke="url(#gold)" stroke-width="1"/>
  <line x1="292" y1="306" x2="410" y2="306" stroke="url(#gold)" stroke-width="1"/>
  <path d="M280 299 l7 7 -7 7 -7 -7 z" fill="url(#gold)"/>
  <!-- tagline -->
  <text x="280" y="344" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" letter-spacing="9" fill="url(#gold)">PRIVATE WATCH ADVISOR</text>
